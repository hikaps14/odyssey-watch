name: Odyssey IMAX 70mm Background Worker

on:
  schedule:
    # Runs Prime Pass (Tiers 1-3) 4 times a day during active hours (UTC)
    - cron: '0 13,17,21,1 * * *'
    # Runs Full Sweep Pass (Tiers 1-4) twice daily at 6 AM & 6 PM Central (11:00 & 23:00 UTC)
    - cron: '0 11,23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime

jobs:
  scan-inventory:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: 🚀 Execute Scraper Worker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # If triggered at 11:00 or 23:00 UTC (6 AM / 6 PM Central), run FULL sweep
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "11" ] || [ "$HOUR" = "23" ]; then
            echo "Running Full Sweep (Priorities 1-4)..."
            python scanner_worker.py --mode full
          else
            echo "Running Prime Pass (Priorities 1-3)..."
            python scanner_worker.py --mode prime
          fi

    - name: 💾 Commit Updated Cache Back to Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cache_inventory.json || true
          git add tracker_alert_state.json || true
          git add odyssey_scan_history.txt || true
          git commit -m "auto: refresh seat map cache [skip ci]" || exit 0
          git push          git add cache_inventory.json tracker_alert_state.json odyssey_scan_history.txt || true
          git commit -m "auto: refresh seat map cache [skip ci]" || exit 0
          git push
